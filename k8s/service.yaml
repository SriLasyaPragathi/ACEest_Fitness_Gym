apiVersion: v1
kind: Service
metadata:
  name: aceest-service
  namespace: aceest-production
  labels:
    app: aceest
    tier: api
  annotations:
    description: "Service for ACEest Fitness API"
spec:
  type: LoadBalancer  # LoadBalancer for Minikube; use ClusterIP for internal-only
  selector:
    app: aceest
    tier: api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  sessionAffinity: None
  # For Minikube: optional to specify LoadBalancer class
  loadBalancerSourceRanges:
    - "0.0.0.0/0"  # Allow from anywhere (restrict in production)
