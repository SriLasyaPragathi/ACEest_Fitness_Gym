---
# Ingress with Header-Based Routing for A/B Testing
# Note: Requires NGINX Ingress Controller installed on cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-ingress
  namespace: aceest-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-AB-Test-Group"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
    # Canary weight for variant B: 50%
    nginx.ingress.kubernetes.io/canary-weight: "50"
spec:
  ingressClassName: nginx
  rules:
  - host: aceest.local
    http:
      paths:
      # Primary path - Variant A (control group)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-variant-a-svc
            port:
              number: 80
      # Variant B (test group) via canary annotation
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-variant-b-svc
            port:
              number: 80

---
# Service for Variant A (for ingress routing)
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a-svc
  namespace: aceest-production
spec:
  type: ClusterIP
  selector:
    app: aceest
    variant: a
  ports:
    - name: http
      port: 80
      targetPort: 5000

---
# Service for Variant B (for ingress routing)
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b-svc
  namespace: aceest-production
spec:
  type: ClusterIP
  selector:
    app: aceest
    variant: b
  ports:
    - name: http
      port: 80
      targetPort: 5000
