apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-service
  namespace: aceest-production
  labels:
    app: aceest
    deployment-strategy: ab-testing
spec:
  type: LoadBalancer
  selector:
    app: aceest
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  # Note: Both variant-a (2 replicas) and variant-b (2 replicas) pods selected
  # Traffic distribution: 50/50 based on replica count
