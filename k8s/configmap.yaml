apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-config
  namespace: aceest-production
data:
  FLASK_ENV: "production"
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
  # Database configuration
  DB_PATH: "/app/data/aceest_fitness.db"
  # API configuration
  API_PORT: "5000"
  # Feature flags (for A/B testing)
  FEATURE_NEW_UI: "false"
  FEATURE_CANARY: "false"
