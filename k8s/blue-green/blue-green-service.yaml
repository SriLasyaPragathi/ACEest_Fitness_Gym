apiVersion: v1
kind: Service
metadata:
  name: aceest-api-blue-green
  namespace: aceest-production
  labels:
    app: aceest-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  selector:
    app: aceest-api
    environment: blue  # Switch to 'green' to route traffic
