# Green Environment - New Version (Standby)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-api-green
  namespace: aceest-production
  labels:
    app: aceest-api
    version: v2
    environment: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-api
      environment: green
  template:
    metadata:
      labels:
        app: aceest-api
        version: v2
        environment: green
    spec:
      containers:
      - name: aceest-api
        image: docker.io/aceest-fitness-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_PATH
          value: "/data/aceest.db"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aceest-pvc
