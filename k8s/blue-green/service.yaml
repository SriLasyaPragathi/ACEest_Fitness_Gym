apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-green-service
  namespace: aceest-production
  labels:
    app: aceest
    deployment-strategy: blue-green
spec:
  type: LoadBalancer
  selector:
    app: aceest
    version: blue  # Initially points to BLUE (v1.0.0)
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
