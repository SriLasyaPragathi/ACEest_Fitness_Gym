name: CI/CD Pipeline - ACEest Fitness API

# Trigger on push and pull requests to main and develop branches
on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/aceest-fitness-api
  PYTHON_VERSION: "3.11"

jobs:
  # ============ STAGE 1: BUILD & LINT ============
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Run flake8 linting
      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=tests
      
      # Run pytest tests
      - name: Run Pytest tests
        run: |
          pytest tests/ -v --tb=short
      
      # Generate coverage report
      - name: Generate coverage report
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=term
      
      # Upload coverage to Codecov (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ============ STAGE 2: DOCKER IMAGE ============
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: success()
    
    permissions:
      contents: read
      packages: write
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Extract metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Save Docker image locally for testing
      - name: Build Docker image locally
        run: |
          docker build -t aceest:${{ github.sha }} .
          echo "Docker image built successfully: aceest:${{ github.sha }}"

  # ============ STAGE 3: INTEGRATION TESTING ============
  integration-tests:
    name: Integration Tests in Docker
    runs-on: ubuntu-latest
    needs: docker-build
    if: success()
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python (needed for test scripts)
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # Build Docker image for testing
      - name: Build test Docker image
        run: |
          docker build -t aceest:test -f Dockerfile .
      
      # Run container and verify health
      - name: Start container and verify health
        run: |
          docker run -d -p 5000:5000 --name aceest-test aceest:test
          sleep 5
          docker ps -a | grep aceest-test
      
      # Run health check
      - name: Health check
        run: |
          python -c "import requests; r = requests.get('http://localhost:5000/health'); print(r.status_code, r.json())" || sleep 5 && python -c "import requests; r = requests.get('http://localhost:5000/health'); print(r.status_code, r.json())"
      
      # Run tests inside container
      - name: Run tests inside container
        run: |
          docker exec aceest-test pytest tests/ -v --tb=short
      
      # Container logs
      - name: Container logs
        if: always()
        run: |
          docker logs aceest-test
      
      # Cleanup
      - name: Stop and remove container
        if: always()
        run: |
          docker stop aceest-test || true
          docker rm aceest-test || true

  # ============ SUCCESS NOTIFICATION ============
  success-notification:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [build-and-lint, docker-build, integration-tests]
    if: success()
    
    steps:
      - name: Print success message
        run: |
          echo "✅ All CI/CD stages passed successfully!"
          echo "✅ Build & Lint: PASSED"
          echo "✅ Docker Build: PASSED"
          echo "✅ Integration Tests: PASSED"

  # ============ FAILURE NOTIFICATION ============
  failure-notification:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build-and-lint, docker-build, integration-tests]
    if: failure()
    
    steps:
      - name: Print failure message
        run: |
          echo "❌ CI/CD Pipeline Failed!"
          echo "Please check the logs above for details."
          exit 1

# Allow manual workflow dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
