# SonarQube Project Configuration for ACEest Fitness API

# Project Identity
sonar.projectKey=aceest-fitness-api
sonar.projectName=ACEest Fitness & Gym Management System
sonar.projectVersion=${APP_VERSION}
sonar.projectDescription=DevOps CI/CD pipeline for ACEest Fitness & Gym with automated testing and deployment

# Source Code Location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.11
sonar.python.file.suffixes=.py

# Test Coverage
sonar.coverage.exclusions=**/__init__.py,**/tests/**,**/venv/**,**/.venv/**
sonar.test.inclusions=tests/**/*.py

# Exclusions (don't analyze these)
sonar.exclusions=**/migrations/**,**/venv/**,**/.venv/**,**/node_modules/**,**/.git/**,**/build/**,**/__pycache__/**

# Code Analysis Rules
sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate (optional - can be set in SonarQube UI)
sonar.qualitygate.wait=true

# Issue Tracking
sonar.sources.inclusions=app.py,tests/**/*.py
