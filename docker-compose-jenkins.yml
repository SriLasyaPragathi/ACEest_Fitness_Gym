version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-aceest:latest
    container_name: jenkins-aceest
    restart: always

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount kubeconfig for Minikube access
      - ~/.kube/config:/var/jenkins_home/.kube/config:ro
      - ~/.minikube/ca.crt:/var/jenkins_home/.minikube/ca.crt:ro
      - ~/.minikube/client.crt:/var/jenkins_home/.minikube/client.crt:ro
      - ~/.minikube/client.key:/var/jenkins_home/.minikube/client.key:ro

    environment:
      - JENKINS_OPTS=--httpPort=8080
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - KUBECONFIG=/var/jenkins_home/.kube/config
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    user: root

    networks:
      - jenkins-network
      - aceest-network

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins-network:
    driver: bridge
  # Connect to the existing aceest-network for K8s access
  aceest-network:
    external: true
