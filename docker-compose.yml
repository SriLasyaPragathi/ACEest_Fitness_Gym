services:
  aceest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aceest-fitness-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - aceest_db:/app/data
      - aceest_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - aceest-network

  # Jenkins Service (CI/CD Pipeline Orchestration)
  jenkins:
    image: jenkins/jenkins:lts
    container_name: aceest-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
      - JAVA_OPTS=-Duser.timezone=UTC
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    user: root
    networks:
      - aceest-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Optional: Database service (if migrating to PostgreSQL in future)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: aceest-db
  #   environment:
  #     POSTGRES_DB: aceest_fitness
  #     POSTGRES_USER: aceest
  #     POSTGRES_PASSWORD: secure_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - aceest-network

  # SonarQube Service (Code Quality Analysis)
  sonarqube:
    image: sonarqube:10-community
    container_name: aceest-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:h2:tcp://localhost:9092/sonarqube
      - SONARQUBE_JDBC_DRIVER=org.h2.Driver
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - aceest-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/system/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  aceest-network:
    driver: bridge

volumes:
  postgres_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  aceest_db:
  aceest_logs:
